[metadata]
name = auv_vla_reasoning
version = 0.1.0
description = Real-vehicle KMU26 VLA inference server and ROS 2 adapter
long_description_content_type = text/markdown
license = Apache-2.0

[options]
packages = find_namespace:
include_package_data = True
install_requires =
    numpy>=1.23.5,<2
    requests>=2.32,<3
    json-numpy>=2,<3

[options.packages.find]
include = auv_vla_reasoning*
exclude = *__pycache__*

[options.package_data]
auv_vla_reasoning._vendor.gr00t =
    py.typed
    model/backbone/eagle2_hg_model/*.json
    model/backbone/eagle2_hg_model/*.txt

[options.entry_points]
console_scripts =
    auv-vla-server = auv_vla_reasoning.server:main
    auv-vla-ros = auv_vla_reasoning.ros:main
    auv-vla-client = auv_vla_reasoning.client:main

[options.extras_require]
server =
    fastapi>=0.115,<1
    uvicorn>=0.30,<1
test =
    pytest>=7,<9
    httpx>=0.27,<1
    PyYAML>=6,<7
    fastapi>=0.115,<1

[develop]
script_dir=$base/lib/auv_vla_reasoning
[install]
install_scripts=$base/lib/auv_vla_reasoning
