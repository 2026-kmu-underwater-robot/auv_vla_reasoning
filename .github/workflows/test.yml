name: Inference checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[test]' ruff black
      - run: ruff check auv_vla_reasoning tests
      - run: black --check --exclude '/_vendor/' auv_vla_reasoning tests
      - run: python -m pytest -q
