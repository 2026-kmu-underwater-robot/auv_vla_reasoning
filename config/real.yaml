vla_observation:
  ros__parameters:
    use_sim_time: false
    max_sensor_age_sec: 0.25
    default_task: ""
    # Preserve the training view: camera0=ego, camera1=buoy_release.
    ego_image_topic: /imx219/camera0/image_raw/compressed
    ego_image_transport: compressed
    buoy_release_image_topic: /imx219/camera1/image_raw/compressed
    buoy_release_image_transport: compressed
    # For an explicitly selected RealSense view, set its topic and transport: raw.
    # Raw images must use rgb8 or bgr8; no camera is substituted automatically.
    dvl_twist_topic: /dvl/twist
    dvl_data_topic: /dvl/data
    imu_topic: /mavros/imu/data
    depth_topic: /depth/pose
    task_description_topic: /vla/task_description
    action_channels: [5, 6, 3, 4]
    neutral_pwm: 1500
    pwm_span: 300
    depth_pose_z_is_positive_up: true
    body_frame: base_link
    dvl_input_frame: dvl_link
    dvl_convention: FRD

vla_policy:
  ros__parameters:
    use_sim_time: false
    server_url: http://127.0.0.1:8000
    dry_run: true
    expected_mode: STABILIZE
    max_action_age_sec: 0.3
    command_limit: 0.3
    command_slew_per_sec: 0.5
